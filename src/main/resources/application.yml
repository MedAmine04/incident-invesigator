spring:
  application:
    name: incident-investigator

  datasource:
    url: jdbc:postgresql://localhost:5432/incident_investigator
    username: pfa_user
    password: pfa_pass
    driver-class-name: org.postgresql.Driver

  ai:
    google:
      genai:
        api-key: ${GOOGLE_AI_KEY}
        chat:
          model: gemini-2.5-flash
        embedding:
          api-key: ${GOOGLE_AI_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768


    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.ai.tool: debug
    org.springframework.ai.chat.client.advisor: debug